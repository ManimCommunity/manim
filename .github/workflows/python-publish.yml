name: Publish Release

on:
  release:
    # Releases (from main) and prereleases (from a preview/* branch); see
    # docs/source/contributing/releasing.md.
    types: [released, prereleased]

jobs:
  release:
    name: "Publish release"
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v7
      with:
        # The release check looks up the branches containing the tag.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Check the release
      env:
        TAG: ${{ github.event.release.tag_name }}
        KIND: ${{ github.event.release.prerelease && 'prerelease' || 'release' }}
      run: |
        uv run --no-project --python 3.13 --with click --with packaging \
          scripts/release.py check-release "$TAG" --kind "$KIND"

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev libcairo2-dev libpango1.0-dev

    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: 3.13

    - name: Build and push release to PyPI
      run: |
        uv build
        uv publish

    - name: Store artifacts
      uses: actions/upload-artifact@v7
      with:
          path: dist/*.tar.gz
          name: manim.tar.gz

    - name: Upload Release Asset
      shell: bash
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=${{ github.event.release.tag_name }}
        gh release upload "$TAG" "dist/manim-${TAG#v}.tar.gz"
