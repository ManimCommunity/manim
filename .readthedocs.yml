version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  jobs:
    pre_build:
      # Logged to help choosing the number of processes used below.
      - nproc
      - free -m
    build:
      html:
        # -j 4 rather than "auto": the build may see more CPUs than it gets,
        # and its memory is limited. "timeout" stops Sphinx before Read the
        # Docs' own limit, which discards the output of the command it kills;
        # this way the log shows which documents were still being read.
        - cd docs/source && timeout --verbose 1260 python -m sphinx -T -j 4 -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
