version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  jobs:
    pre_build:
      # Logged to help choosing the number of processes used below.
      - nproc
      - free -m
    build:
      html:
        # -j 4 rather than "auto": the build has 2 CPUs and 4 processes were
        # faster than 2 in tests. Read the Docs discards the output of a
        # command it kills at its time limit, so Sphinx is stopped earlier
        # (with SIGABRT, which makes Python print where every process is) and
        # the log is printed from a file, which hung processes cannot block.
        - >-
          cd docs/source &&
          PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
          timeout --verbose --signal=ABRT --kill-after=30 1000
          python -m sphinx -T -j 4 -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html
          > ../sphinx.log 2>&1;
          status=$?;
          tail -n 2000 ../sphinx.log;
          exit $status

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
