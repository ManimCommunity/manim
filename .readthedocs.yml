# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  apt_packages:
    # manimpango and pycairo ship no Linux wheels and are built from source
    - libpango1.0-dev
    - pkg-config

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
