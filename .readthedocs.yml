version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  # The examples are rendered in a first pass that writes no pages (the dummy
  # builder only reads them), into the cache of the HTML output directory.
  # The HTML build then reuses the doctrees of that pass, so it only writes
  # the pages, with every example taken from the cache, see
  # manim.utils.docbuild.manim_directive.
  jobs:
    pre_build:
      - cd docs/source && python -m sphinx -T -j auto -b dummy -d _build/doctrees -D language=en -D manim_cache=$READTHEDOCS_OUTPUT/html/_manim . /tmp/manim-render
    build:
      html:
        - cd docs/source && python -m sphinx -T -j auto -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
