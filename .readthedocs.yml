version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  # TEMPORARY (debugging stuck builds): report machine details and the state of
  # the build to ntfy.sh, as Read the Docs keeps no output of a stuck command.
  # The sphinx output is also written to /tmp/sphinx.log for the watchdog.
  #
  # The examples are rendered ahead of the HTML build, in several short
  # commands (see manim/utils/docbuild/prerender.py): collect the examples
  # (dummy builder: read only), render them in chunks of two parallel
  # processes (one per CPU of the builders), then build the HTML using the
  # rendered results.
  jobs:
    pre_build:
      - bash docs/rtd_watchdog.sh info
      - bash docs/rtd_watchdog.sh start
      - bash docs/rtd_watchdog.sh run docs/source python -m sphinx -T -t manim-collect -b dummy -d /tmp/collect/doctrees . /tmp/collect/out
      - bash docs/rtd_watchdog.sh run docs/source python -m manim.utils.docbuild.prerender media/_prerender --chunk 1/3 --jobs 2
      - bash docs/rtd_watchdog.sh run docs/source python -m manim.utils.docbuild.prerender media/_prerender --chunk 2/3 --jobs 2
      - bash docs/rtd_watchdog.sh run docs/source python -m manim.utils.docbuild.prerender media/_prerender --chunk 3/3 --jobs 2
    build:
      html:
        - MANIM_RTD_SPHINX_OPTS="-tmanim-use-prerendered -j2" bash docs/rtd_watchdog.sh sphinx

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
