version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  # TEMPORARY (debugging timeouts): abort sphinx before Read the Docs kills the
  # build, so its output and a traceback of every thread (faulthandler) show up.
  jobs:
    build:
      html:
        - cd docs/source && timeout -s ABRT 1000 python -u -X faulthandler -m sphinx -T -v -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
