version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-22.04

  tools:
    python: "3.13"

  apt_packages:
    - libpango1.0-dev
    - graphviz

  # TEMPORARY (debugging stuck builds): report machine details and the state of
  # the build to ntfy.sh, as Read the Docs keeps no output of a stuck command.
  # The sphinx output is also written to /tmp/sphinx.log for the watchdog.
  jobs:
    pre_build:
      - bash docs/rtd_watchdog.sh info
      - bash docs/rtd_watchdog.sh start
    build:
      html:
        - MANIM_RTD_SPHINX_QUIET=1 bash docs/rtd_watchdog.sh sphinx

python:
   install:
      - requirements: docs/rtd-requirements.txt
      - requirements: docs/requirements.txt
      - method: pip
        path: .
